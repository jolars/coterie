[package]
name = "coterie"
version = "0.2.0"
edition = "2024"
authors = ["Johan Larsson <johan@jolars.co>"]
description = "Project-native orchestration for coding agents"
repository = "https://github.com/jolars/coterie"
homepage = "https://github.com/jolars/coterie"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["agents", "automation", "cli", "orchestration"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
ulid = "3.0.0"

[lints.rust]
unsafe_code = "forbid"
