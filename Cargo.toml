[package]
name = "coterie"
version = "0.1.0"
edition = "2024"
authors = ["Johan Larsson <johan@jolars.co>"]
description = "Project-native orchestration for coding agents"
repository = "https://github.com/jolars/coterie"
homepage = "https://github.com/jolars/coterie"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["agents", "automation", "cli", "orchestration"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = "1.0.229"
thiserror = "2.0.20"
ulid = "3.0.0"

[dev-dependencies]
serde_json = "1.0.151"

[lints.rust]
unsafe_code = "forbid"
