[package]
name = "coterie"
version = "0.1.0"
edition = "2024"
authors = ["Johan Larsson <johan@jolars.co>"]
description = "Project-native orchestration for coding agents"
repository = "https://github.com/jolars/coterie"
homepage = "https://github.com/jolars/coterie"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["agents", "automation", "cli", "orchestration"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5.48", default-features = false, features = [
  "derive",
  "error-context",
  "help",
  "std",
  "usage",
] }
getrandom = "0.4.3"
git2 = { version = "0.21.0", features = ["vendored-libgit2"] }
hmac = "0.13.0"
nix = { version = "0.30.1", features = ["fs", "signal", "user"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1.2.2"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
signal-hook = { version = "0.3.18", features = ["extended-siginfo"] }
thiserror = "2.0.20"
toml = { version = "1.1.5", default-features = false, features = [
  "std",
  "serde",
  "parse",
] }
tokio = { version = "1.53.1", features = [
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "sync",
  "time",
] }
ulid = "3.0.0"

[dev-dependencies]
nix = { version = "0.30.1", features = ["term"] }

[lints.rust]
unsafe_code = "forbid"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
