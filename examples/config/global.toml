# A trusted two-role archetype for foreground coordination and background work.
schema_version = 1
archetype = "global:pair@1"
# To permit agents with `project:attach` to attach additional projects, list
# existing absolute parent directories here. An omitted list denies attachment.
# allowed_project_roots = ["/home/you/projects"]

[providers.codex]
command = ["codex"]

[limits]
max_concurrent_agents = 6
max_agents_per_run = 12
max_spawns_per_minute = 6

[supervision]
job_timeout_seconds = 1800
# Stop after every session exits and pending operations are resolved.
idle_timeout_seconds = 60

[permission_profiles.interactive]
filesystem = "project-write"
network = "provider-default"
approvals = "interactive"

[permission_profiles.implementation]
filesystem = "workspace-write"
network = "deny"
approvals = "never"

[permission_profiles.inspect]
filesystem = "read-only"
network = "deny"
approvals = "never"

[archetypes."global:pair@1"]
lead = "coordinator"

[archetypes."global:pair@1".roles.coordinator]
provider = "codex"
mode = "interactive"
workspace = "project"
permission_profile = "interactive"
instructions = "Coordinate tasks through Coterie."
capabilities = ["spawn:builder", "send:*", "task:*", "logs:*"]

[archetypes."global:pair@1".roles.builder]
provider = "codex"
mode = "job"
workspace = "worktree"
permission_profile = "implementation"
max_instances = 3
capabilities = ["send:coordinator", "task:read", "task:claim", "task:comment"]
