name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: M0 gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1

      - name: Configure the devenv cache
        uses: cachix/cachix-action@v17
        with:
          name: devenv

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Restore Rust build artifacts
        uses: Swatinem/rust-cache@v2.9.2

      - name: Run the development-environment gate
        run: devenv test

  release:
    name: Versionary
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.VERSIONARY_ENABLED == 'true'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out full release history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Run Versionary
        uses: jolars/versionary@v1.2.0
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
